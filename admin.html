<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GameSpotter · Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<section class="screen adm">
  <div class="wrap wide">
    <div class="row adm-head">
      <h1 class="adm-title">Game<span>Spotter</span> <small>administration</small></h1>
      <div class="grow"></div>
      <button class="btn sm hidden" id="bExport" type="button">Exporter les corrections</button>
      <button class="btn sm ghost hidden" id="bLogout" type="button">Déconnexion</button>
    </div>

    <form class="card col hidden" id="login" autocomplete="off">
      <h2>Connexion</h2>
      <label class="f">Mot de passe
        <input type="password" id="pwd" autocomplete="current-password">
      </label>
      <button class="btn pri block" type="submit">Se connecter</button>
      <div class="mut small" id="loginMsg"></div>
    </form>

    <div class="adm-main hidden" id="main">
      <div class="card adm-list">
        <div class="seg" id="tabs"><button type="button" data-t="reports" class="on">Signalements <span id="nOpen"></span></button><button type="button" data-t="all">Toutes les vues</button></div>
        <div class="row" style="margin-top:10px">
          <input type="text" id="search" placeholder="Filtrer (jeu, lieu, identifiant)…" autocomplete="off">
        </div>
        <label class="mut small adm-check" id="openOnlyBox"><input type="checkbox" id="openOnly" checked> En attente seulement</label>
        <div class="adm-items" id="items"></div>
      </div>
      <div class="card adm-edit" id="edit"><p class="mut">Choisis une vue dans la liste.</p></div>
    </div>
  </div>
</section>
<div class="toast hidden" id="toast"></div>

<script src="packs/img/dispo.js" onerror="void 0"></script>
<script src="js/mapview.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
